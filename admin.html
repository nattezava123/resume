<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ผู้ดูแลระบบ - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <div class="sidebar">
            <div style="color: white; font-weight: bold; font-size: 14px; text-align: center; margin-bottom: 20px;">ADMIN PANEL</div>
            <div class="menu-item active" onclick="toggleSubBar(true)"><div class="menu-icon">⚙️</div><span>การจัดการระบบ</span></div>
        </div>
        <div class="sub-sidebar" id="admin-sub-bar">
            <div class="sub-menu-icon active" id="sub-btn-approves" onclick="switchAdminTab('approves')" title="อนุมัติรายการ">✔️</div>
            <div class="sub-menu-icon" id="sub-btn-prices" onclick="switchAdminTab('prices')" title="ตั้งค่าราคาน้ำมัน">⛽</div>
            <div class="sub-menu-icon" id="sub-btn-users" onclick="switchAdminTab('users')" title="จัดการพนักงาน">👥</div>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="logo-container d-flex align-items-baseline">
                    <span class="title">Chanchai</span> <span class="subtitle ms-2">OFFICE</span>
                    <span class="ms-3 ps-3 border-start border-2 text-secondary fw-bold" style="font-size: 15px;">ระบบผู้ดูแลระบบ (Admin)</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-badge" id="admin-id-badge">ADMIN</div>
                    <div class="window-controls">
                        <div class="win-btn close" onclick="exitSystem()">✕</div>
                    </div>
                </div>
            </div>

            <div class="view-body">
                <div id="adm-approves-view" class="adm-tab-view">
                    <div class="blue-panel">
                        <div class="panel-title">รายการรออนุมัติค่าน้ำมันเชื้อเพลิง</div>
                        <div id="admin-verification-queue" class="d-flex flex-column gap-3"></div>
                    </div>
                </div>

                <div id="adm-prices-view" class="adm-tab-view" style="display: none;">
                    <div class="blue-panel">
                        <div class="panel-title">เกณฑ์ราคาน้ำมันเชื้อเพลิง / ไฟฟ้า / แก๊ส</div>
                        <div class="table-responsive">
                            <table class="data-table table align-middle">
                                <thead>
                                    <tr>
                                        <th>ประเภทรถ</th>
                                        <th>ชื่อเชื้อเพลิง</th>
                                        <th>เรทราคา (บาท / กิโลเมตร)</th>
                                    </tr>
                                </thead>
                                <tbody id="fuel-price-tbody"></tbody>
                            </table>
                        </div>
                        <div class="text-center mt-4"><button class="btn-pill btn-white" onclick="updateFuelPrices()">บันทึกอัตราอัปเดต</button></div>
                    </div>
                </div>

                <div id="adm-users-view" class="adm-tab-view" style="display: none;">
                    <div class="blue-panel">
                        <div class="panel-title">ข้อมูลพนักงานในระบบ</div>
                        <div class="table-responsive">
                            <table class="data-table table">
                                <thead><tr><th>ลำดับ</th><th>รหัสพนักงาน</th><th>ชื่อ-นามสกุล</th><th>ตำแหน่ง</th><th>เบอร์โทรศัพท์</th></tr></thead>
                                <tbody id="admin-user-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
